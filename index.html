<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kate Winchester — web design</title>
<meta name="description" content="Websites with character — business-card sites, portfolios and invitation sites.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Jost:wght@300;400&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070607; --red:#c1121f; --blood:#7a0b14; --glow:#ff2a3a;
  --bone:#ece4d8; --muted:#a09590; --line:rgba(193,18,31,.45);
  --serif:'Cormorant Garamond','Times New Roman',serif;
  --sans:'Jost',system-ui,sans-serif;
  --gothic:'UnifrakturMaguntia','Cormorant Garamond',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--bone);font-family:var(--sans);font-weight:300;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--glow);outline-offset:3px}

/* background */
#bg{position:fixed;inset:0;z-index:0}
#bg canvas{width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.75) 100%)}

/* stage */
#viewport{position:fixed;inset:0;z-index:2;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
.slide{position:absolute;transform-origin:50% 50%;overflow:hidden;
  border:1px solid rgba(193,18,31,.18);background:rgba(7,6,7,.55)}
.inner{width:100%;height:100%;overflow-y:auto;display:flex;padding:84px 8vw 84px;scrollbar-width:thin;scrollbar-color:var(--blood) transparent}
.wrap{margin:auto;width:100%;max-width:1180px}
.overview .slide{cursor:pointer;border-color:var(--red)}
.overview .slide::after{content:"";position:absolute;inset:0;z-index:9}

/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .5s ease,transform .5s ease;transition-delay:calc(var(--i,0)*50ms + 200ms)}
.slide.active .rv{opacity:1;transform:none}
.overview .rv{opacity:1;transform:none;transition-delay:0s}

/* chrome */
header{position:fixed;z-index:20;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:20px clamp(16px,4vw,44px)}
.brand{font-family:var(--gothic);font-size:1.9rem;letter-spacing:.02em;text-shadow:0 0 18px rgba(255,42,58,.55)}
.tools{display:flex;gap:6px;align-items:center}
.lang button,.ov{font-size:.78rem;letter-spacing:.18em;padding:8px 10px;border:1px solid transparent;color:var(--muted);transition:.25s}
.lang button:hover,.ov:hover{color:var(--bone)}
.lang button[aria-pressed="true"]{color:var(--bone);border-color:var(--line)}
.ov{border-color:var(--line);margin-left:8px}
.dots{position:fixed;z-index:20;right:clamp(12px,2.2vw,30px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px}
.dots button{width:11px;height:11px;border:1px solid var(--red);transform:rotate(45deg);transition:.3s;position:relative}
.dots button:hover{background:rgba(193,18,31,.5)}
.dots button.on{background:var(--red);box-shadow:0 0 14px var(--glow)}
.dots button span{position:absolute;right:22px;top:50%;transform:translateY(-50%) rotate(-45deg);white-space:nowrap;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;opacity:0;pointer-events:none;transition:.25s;color:var(--bone)}
.dots button:hover span{opacity:1}
.pager{position:fixed;z-index:20;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:18px;font-size:.78rem;letter-spacing:.25em;color:var(--muted)}
.pager button{width:38px;height:38px;border:1px solid var(--line);display:grid;place-items:center;transition:.25s;font-size:1rem}
.pager button:hover{background:var(--blood);border-color:var(--red)}
.overview .pager,.overview .dots{opacity:.0;pointer-events:none}

/* type */
.kicker{font-size:.8rem;letter-spacing:.35em;text-transform:uppercase;color:var(--red);margin-bottom:18px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.02}
h1{font-size:clamp(2.8rem,7.4vw,6.6rem);text-transform:uppercase;letter-spacing:.01em}
h1 em,h2 em{font-style:italic;color:var(--red);text-shadow:0 0 30px rgba(255,42,58,.45)}
h2{font-size:clamp(2.2rem,4.6vw,4rem);text-transform:uppercase;margin-bottom:12px}
.orn{display:flex;align-items:center;gap:12px;margin:14px 0 clamp(20px,4vh,40px);color:var(--red)}
.orn::before,.orn::after{content:"";height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--red))}
.orn::after{background:linear-gradient(270deg,transparent,var(--red))}
.orn i{width:8px;height:8px;background:var(--red);transform:rotate(45deg);box-shadow:0 0 12px var(--glow)}
p{line-height:1.7;color:#cfc6bb;font-size:clamp(1rem,1.25vw,1.15rem)}
.btn{display:inline-block;padding:15px 30px;border:1px solid var(--red);letter-spacing:.2em;text-transform:uppercase;font-size:.8rem;transition:.3s;position:relative}
.btn.fill{background:var(--blood)}
.btn:hover{background:var(--red);box-shadow:0 0 28px rgba(255,42,58,.5)}
.ctas{display:flex;gap:16px;flex-wrap:wrap;margin-top:34px}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:30px;align-items:center}
.hero p{max-width:540px;margin-top:26px}
.arch{position:relative;justify-self:center;width:min(100%,340px)}
.arch svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 0 22px rgba(255,42,58,.45))}
.arch .moon{position:absolute;left:50%;top:34%;width:46%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#ff4a55,var(--red) 45%,var(--blood) 100%);box-shadow:0 0 90px rgba(193,18,31,.8);animation:pulse 5s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.06);box-shadow:0 0 130px rgba(255,42,58,.9)}}

/* about */
.about{display:grid;grid-template-columns:.7fr 1.3fr;gap:clamp(24px,5vw,70px);align-items:center}
.portrait{aspect-ratio:3/4;max-width:340px;width:100%;justify-self:center;border:1px solid var(--red);border-radius:999px 999px 0 0;position:relative;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 30%,rgba(193,18,31,.5),rgba(7,6,7,.95) 70%);box-shadow:inset 0 0 60px rgba(0,0,0,.8),0 0 40px rgba(193,18,31,.25)}
.portrait::before{content:"";position:absolute;inset:10px;border:1px solid var(--line);border-radius:999px 999px 0 0}
.portrait b{font-family:var(--gothic);font-weight:400;font-size:clamp(6rem,12vw,10rem);color:var(--bone);text-shadow:0 0 40px var(--glow)}
.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 30%;filter:contrast(1.05) saturate(.95)}
.portrait::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(7,6,7,.7)),radial-gradient(circle at 50% 0,rgba(193,18,31,.18),transparent 60%);pointer-events:none}
.portrait::before{z-index:2;pointer-events:none}
.about p+p{margin-top:16px}
.stats{display:flex;gap:clamp(20px,4vw,50px);margin-top:34px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--serif);font-size:clamp(2.2rem,4vw,3.4rem);color:var(--red);line-height:1}
.stat span{font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}

/* cards */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,28px)}
.card{position:relative;padding:clamp(22px,2.4vw,36px);border:1px solid var(--line);background:linear-gradient(180deg,rgba(122,11,20,.18),rgba(7,6,7,.7));transition:border-color .3s,box-shadow .3s}
.card::before,.card::after{content:"";position:absolute;width:16px;height:16px;border:1px solid var(--red)}
.card::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.card::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.card:hover{border-color:var(--red);box-shadow:0 0 36px rgba(193,18,31,.3)}
.card h3{font-size:clamp(1.5rem,2vw,2rem);margin-bottom:8px}
.price{font-family:var(--serif);font-style:italic;font-size:clamp(1.6rem,2.4vw,2.2rem);color:var(--red);margin-bottom:18px;text-shadow:0 0 20px rgba(255,42,58,.4)}
.card ul{list-style:none;display:grid;gap:10px}
.card li{padding-left:20px;position:relative;color:#cfc6bb;font-size:.98rem;line-height:1.45}
.card li::before{content:"";position:absolute;left:0;top:.5em;width:6px;height:6px;background:var(--red);transform:rotate(45deg)}
.note{margin-top:26px;color:var(--muted);font-size:.9rem;font-style:italic}

/* portfolio */
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,2vw,26px)}
.work{display:block;border:1px solid var(--line);position:relative;overflow:hidden;background:#0b090a;transition:.35s}
.work:hover{border-color:var(--red);box-shadow:0 0 36px rgba(193,18,31,.35)}
.thumb{height:clamp(110px,21vh,230px);position:relative;overflow:hidden;background:var(--g)}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:50% 0;transition:transform .6s}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(7,6,7,.6));pointer-events:none}
.work:hover .thumb img,.work:hover .thumb .mock{transform:scale(1.05)}
.mock{position:absolute;inset:0;transition:transform .6s}
.mock::before{content:"";position:absolute;left:8%;right:8%;top:14%;height:8px;background:rgba(236,228,216,.5)}
.mock::after{content:"";position:absolute;left:8%;width:46%;top:32%;height:50%;
  background:linear-gradient(rgba(236,228,216,.7),rgba(236,228,216,.7)) 0 0/100% 10px no-repeat,
             linear-gradient(rgba(236,228,216,.35),rgba(236,228,216,.35)) 0 26px/80% 6px no-repeat,
             linear-gradient(rgba(236,228,216,.35),rgba(236,228,216,.35)) 0 42px/60% 6px no-repeat}
.thumb strong{position:absolute;right:8%;bottom:12%;max-width:80%;text-align:right;line-height:1.05;font-family:var(--gothic);font-weight:400;font-size:clamp(1.6rem,3vw,2.6rem);color:var(--bone);text-shadow:0 2px 20px #000}
.meta{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;gap:10px}
.meta h3{font-size:1.35rem}
.work.soon{cursor:default}.work.soon:hover{border-color:var(--line);box-shadow:none}.work.soon .thumb{filter:saturate(.6) brightness(.8)}
.meta small{display:block;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.meta span{color:var(--red);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}

/* reviews */
.quote{display:flex;flex-direction:column;gap:18px}
.quote::before{content:"“";font-family:var(--serif);font-size:5rem;line-height:.6;color:var(--red);text-shadow:0 0 24px rgba(255,42,58,.5)}
.quote p{font-family:var(--serif);font-size:clamp(1.1rem,1.5vw,1.4rem);font-style:italic;color:var(--bone)}
.quote cite{font-style:normal;font-size:.75rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:auto}

/* contact */
.contact{text-align:center}
.contact h2{font-size:clamp(2.4rem,6vw,5.4rem)}
.contact p{max-width:560px;margin:0 auto}
.links{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:38px}
.foot{margin-top:60px;font-size:.75rem;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
.foot .brand{font-size:1.4rem;letter-spacing:0;text-transform:none;color:var(--bone)}

@media (max-width:860px){
  .hero,.about,.grid3,.grid2{grid-template-columns:1fr}
  .arch{width:150px;order:-1;opacity:.9}
  .portrait{max-width:170px}
  .inner{padding:78px 22px 90px}
  .dots{right:6px;gap:11px}
  .dots button span{display:none}
  .thumb{height:120px}
  .pager{bottom:14px}
  h1{font-size:clamp(2.4rem,11vw,3.6rem)}
}
@media (prefers-reduced-motion:reduce){.rv{transition-duration:.01s;transition-delay:0s}.arch .moon{animation:none}}
</style>
</head>

  <!-- 6. CONTACT -->

    <div class="links rv" id="links"></div>
    <div class="foot rv"><span class="brand" id="footBrand"></span><br>© <span id="year"></span></div>
  </div></div></section>

</div></div>

/* =====================  ЛОГИКА  ===================== */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const slides = $$('.slide'), stage = $('#stage'), N = slides.length;
const ids = slides.map(s=>s.id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
// позиция в "мире": [x, y в экранах, масштаб, поворот°]
const LAYOUT = [[0,0,1,0],[1.1,.4,.7,-5],[2.3,-.3,1.5,4],[3.2,.9,.9,-3],[2.2,1.9,1.2,6],[.6,1.8,1,0]];
let W,H,cur=0,overview=false,busy=false,lockUntil=0,cam,lang='ru';

function layout(){
  W=innerWidth; H=innerHeight;
  slides.forEach((s,i)=>{
    const [gx,gy,sc,r]=LAYOUT[i], x=gx*W*1.9, y=gy*H*1.9;
    Object.assign(s.style,{width:W+'px',height:H+'px',left:(x-W/2)+'px',top:(y-H/2)+'px',transform:`rotate(${r}deg) scale(${sc})`});
    s._p={x,y,sc,r};
  });
}
const camFor = i=>({x:slides[i]._p.x,y:slides[i]._p.y,k:1/slides[i]._p.sc,r:-LAYOUT[i][3]});
function overviewCam(){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  slides.forEach(s=>{const p=s._p,rad=p.sc*Math.hypot(W,H)/2*.92;
    x0=Math.min(x0,p.x-rad);x1=Math.max(x1,p.x+rad);y0=Math.min(y0,p.y-rad);y1=Math.max(y1,p.y+rad)});
  return {x:(x0+x1)/2,y:(y0+y1)/2,k:Math.min(W/(x1-x0),H/(y1-y0))*.95,r:0};
}
const str = c=>`translate(${W/2}px,${H/2}px) rotate(${c.r}deg) scale(${c.k}) translate(${-c.x}px,${-c.y}px)`;

function fly(to){
  const from=cam; cam=to;
  stage.style.transform=str(to);
  if(reduce){return}
  busy=true;
  const mid={x:(from.x+to.x)/2,y:(from.y+to.y)/2,r:(from.r+to.r)/2,k:Math.min(from.k,to.k)*.7};
  const a=stage.animate([{transform:str(from)},{transform:str(mid),offset:.5},{transform:str(to)}],
    {duration:650,easing:'cubic-bezier(.5,0,.2,1)'});
  a.onfinish=a.oncancel=()=>{busy=false;lockUntil=Date.now()+150};
}
function ui(){
  slides.forEach((s,i)=>{s.classList.toggle('active',i===cur||overview);
    if(overview||i===cur)s.removeAttribute('inert');else s.setAttribute('inert','')});
  $$('#dots button').forEach((b,i)=>b.classList.toggle('on',i===cur));
  $('#count').textContent=String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
  document.body.classList.toggle('overview',overview);
}
function go(i,push=true){
  if(i<0||i>=N||busy) return;
  if(i===cur&&!overview) return;
  cur=i; overview=false; ui(); fly(camFor(i));
  if(push) try{history.replaceState(null,'','#'+ids[i])}catch(e){}
}
function toggleOverview(){
  if(busy) return;
  if(overview){overview=false;ui();fly(camFor(cur))}
  else{overview=true;ui();fly(overviewCam())}
}

/* управление */
addEventListener('wheel',e=>{
  if(overview){e.preventDefault();return}
  const dir=Math.sign(Math.abs(e.deltaY)>=Math.abs(e.deltaX)?e.deltaY:e.deltaX); if(!dir) return;
  const inner=$('.inner',slides[cur]);
  if(canScroll(inner,dir)&&Math.abs(e.deltaY)>=Math.abs(e.deltaX)) return;
  e.preventDefault();
  if(busy||Date.now()<lockUntil||Math.max(Math.abs(e.deltaY),Math.abs(e.deltaX))<8) return;
  lockUntil=Date.now()+450; go(cur+dir);
},{passive:false});
function canScroll(el,dir){
  if(el.scrollHeight<=el.clientHeight+2) return false;
  return dir>0 ? el.scrollTop+el.clientHeight<el.scrollHeight-2 : el.scrollTop>2;
}
let t0=null;
addEventListener('touchstart',e=>{const t=e.touches[0];t0={x:t.clientX,y:t.clientY,s:$('.inner',slides[cur]).scrollTop}},{passive:true});
addEventListener('touchend',e=>{
  if(!t0||overview){t0=null;return}
  const t=e.changedTouches[0],dx=t.clientX-t0.x,dy=t.clientY-t0.y,inner=$('.inner',slides[cur]);
  const moved=Math.abs(inner.scrollTop-t0.s)>2; t0=null;
  const vertical=Math.abs(dy)>=Math.abs(dx), d=vertical?dy:dx;
  if(Math.abs(d)<55) return;
  const dir=d<0?1:-1;
  if(vertical&&(moved||canScroll(inner,dir))) return;
  go(cur+dir);
},{passive:true});
addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea')) return;
  const k=e.key;
  if(['ArrowRight','ArrowDown','PageDown'].includes(k)){e.preventDefault();go(cur+1)}
  else if(['ArrowLeft','ArrowUp','PageUp'].includes(k)){e.preventDefault();go(cur-1)}
  else if(k===' '){e.preventDefault();go(cur+(e.shiftKey?-1:1))}
  else if(k==='Home')go(0); else if(k==='End')go(N-1);
  else if(k==='o'||k==='O'||k==='щ'||k==='Щ')toggleOverview();
  else if(k==='Escape'&&overview)toggleOverview();
});
slides.forEach((s,i)=>s.addEventListener('click',()=>{if(overview){overview=false;go(i)}}));
$('#prev').onclick=()=>go(cur-1); $('#next').onclick=()=>go(cur+1); $('#ov').onclick=toggleOverview;
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-go]'); if(a){e.preventDefault();go(+a.dataset.go)}
  if(e.target.closest('#brand')){e.preventDefault();go(0)}
});
addEventListener('resize',()=>{layout();cam=overview?overviewCam():camFor(cur);stage.style.transform=str(cam)});

/* язык */
function setLang(l){
  lang=T[l]?l:'en'; const t=T[lang];
  document.documentElement.lang=lang;
  $$('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  $$('[data-i18n]').forEach(el=>{const v=t[el.dataset.i18n]; if(v===undefined)return;
    el.dataset.i18nAttr?el.setAttribute(el.dataset.i18nAttr,v):el.textContent=v});
  $('#heroTitle').innerHTML=t.hero_title;
  $('#contactTitle').innerHTML=t.contact_title;
  $('#stats').innerHTML=t.stats.map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('');
  $('#serviceGrid').innerHTML=t.services.map(s=>`<div class="card rv"><h3>${s.n}</h3><div class="price">${s.p}</div><ul>${s.l.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');
  $('#workGrid').innerHTML=CONFIG.projects.map(p=>{
    const ti=typeof p.title==='string'?p.title:p.title[lang];
    const body=`<div class="thumb" style="--g:${p.grad}">${p.img?`<img src="${p.img}" alt="${ti}" loading="lazy">`:`<div class="mock"></div><strong>${ti}</strong>`}</div>
      <div class="meta"><div><h3>${ti}</h3><small>${p.tag[lang]}</small></div><span>${p.soon?t.soon:t.view+' →'}</span></div>`;
    return p.soon?`<div class="work soon rv">${body}</div>`:`<a class="work rv" href="${p.url}" target="_blank" rel="noopener">${body}</a>`;
  }).join('');
  $('#reviewGrid').innerHTML=t.reviews.map(r=>`<div class="card quote rv"><p>${r.t}</p><cite>— ${r.a}</cite></div>`).join('');
  $('#dots').innerHTML=t.nav.map((n,i)=>`<button aria-label="${n}"><span>${n}</span></button>`).join('');
  $$('#dots button').forEach((b,i)=>b.onclick=()=>go(i));
  $('#links').innerHTML=
    `<a class="btn fill" href="${CONFIG.whatsapp}" target="_blank" rel="noopener">WhatsApp</a>
     <a class="btn" href="${CONFIG.telegram}" target="_blank" rel="noopener">Telegram</a>`;
  slides.forEach(s=>$$('.rv',s).forEach((el,k)=>el.style.setProperty('--i',k)));
  const nm=CONFIG.names[lang];
  $('#brand').textContent=nm; $('#footBrand').textContent=nm;
  $('#initial').textContent=nm.trim().charAt(0).toUpperCase();
  const ph=$('#photo'); if(ph){ph.src=CONFIG.photo;ph.alt=nm}
  document.title=nm+' — '+t.hero_kicker;
  try{localStorage.setItem('lang',lang)}catch(e){}
  ui();
}
$$('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

/* угольки на фоне */
(function(){
  const c=$('#embers'),x=c.getContext('2d');let w,h,P=[];
  const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight;P=Array.from({length:Math.round(w*h/38000)},()=>mk(true))};
  const mk=init=>({x:Math.random()*w,y:init?Math.random()*h:h+10,r:Math.random()*1.8+.4,v:Math.random()*.35+.1,d:Math.random()*Math.PI*2,a:Math.random()*.6+.2});
  addEventListener('resize',rs);rs();
  (function tick(){
    x.clearRect(0,0,w,h);
    for(const p of P){
      p.y-=p.v; p.d+=.012; p.x+=Math.sin(p.d)*.35;
      if(p.y<-10){Object.assign(p,mk(false))}
      x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);
      x.fillStyle=`rgba(255,${40+p.r*20|0},58,${p.a*(p.y/h*.7+.3)})`;
      x.fill();
    }
    if(!reduce)requestAnimationFrame(tick);
  })();
})();

/* старт */
$('#year').textContent=new Date().getFullYear();
layout();
let start=ids.indexOf(location.hash.slice(1)); if(start<0)start=0; cur=start;
cam=camFor(cur); stage.style.transform=str(cam);
let saved=null; try{saved=localStorage.getItem('lang')}catch(e){}
const nl=(navigator.language||'en').slice(0,2);
setLang(saved||(T[nl]?nl:'en'));
</script>
